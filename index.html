<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transpais - Sistema FIDS Pedro Cárdenas</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #d97706;
      --green: #16a34a;
      --red: #dc2626;
      --blue: #2563eb;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--accent);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 1.8rem; color: #fbbf24; }
    .status-bar { font-size: 0.9rem; color: #94a3b8; }
    
    /* Controles de Administración */
    .admin-panel {
      background: var(--card);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .admin-panel h3 { margin-top: 0; color: #fbbf24; }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    .admin-panel input, .admin-panel select, .admin-panel button {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
      font-size: 0.9rem;
    }
    .admin-panel button {
      background: var(--blue);
      cursor: pointer;
      border: none;
      font-weight: bold;
    }
    .admin-panel button:hover { background: #1d4ed8; }
    .btn-voice { background: #8b5cf6 !important; }
    .btn-voice:hover { background: #7c3aed !important; }

    /* Tabla */
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--card);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { background-color: #0284c7; color: white; text-transform: uppercase; font-size: 0.85rem; }
    tr:hover { background-color: #334155; }
    
    .status-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
      display: inline-block;
    }
    .status-espera { background-color: var(--accent); color: white; }
    .status-abordando { background-color: var(--green); color: white; }
    .status-cancelado { background-color: var(--red); color: white; }
    .status-atiempo { background-color: var(--blue); color: white; }

    .btn-action {
      padding: 4px 8px;
      margin-right: 4px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .btn-edit { background: #eab308; color: black; }
    .btn-delete { background: var(--red); color: white; }
    .btn-announce { background: #8b5cf6; color: white; }

    /* Modo TV */
    body.tv-mode .admin-panel, body.tv-mode .actions-cell { display: none; }
    body.tv-mode th, body.tv-mode td { padding: 18px 20px; font-size: 1.3rem; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>TRANSPAIS - Terminal Pedro Cárdenas</h1>
      <div class="status-bar" id="last-update">Sincronizando...</div>
    </div>
    <div id="clock" style="font-size: 1.6rem; font-weight: bold; color: #fbbf24;"></div>
  </header>

  <!-- Panel de administración -->
  <div id="admin-section" class="admin-panel">
    <h3 id="form-title">Agregar / Modificar Salida</h3>
    <input type="hidden" id="edit-index" value="-1">
    
    <div class="form-row">
      <input type="time" id="f-hora" required>
      <input type="text" id="f-destino" placeholder="Destino" style="flex: 2;" required>
      <input type="text" id="f-escalas" placeholder="Escalas / Ruta" style="flex: 3;">
      <input type="text" id="f-autobus" placeholder="No. Autobús" style="width: 110px;">
      <input type="text" id="f-abordaje" placeholder="Abordaje" value="Oficina Pedro Cárdenas">
      <select id="f-estatus">
        <option value="EN ESPERA">EN ESPERA</option>
        <option value="ABORDANDO">ABORDANDO</option>
        <option value="A TIEMPO">A TIEMPO</option>
        <option value="RETRASADO">RETRASADO</option>
        <option value="CANCELADO">CANCELADO</option>
      </select>
      <button onclick="guardarSalida()" id="btn-save">Agregar Salida</button>
      <button onclick="cancelarEdicion()" id="btn-cancel" style="display:none; background:#64748b;">Cancelar</button>
    </div>

    <!-- Ajuste de Voz para Anuncios -->
    <div class="form-row" style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px;">
      <label style="align-self: center; font-weight: bold;">🔊 Configuración de Voz:</label>
      <select id="voice-select" style="max-width: 300px;"></select>
      <button onclick="probarVoz()" class="btn-voice">Probar Voz</button>
    </div>
  </div>

  <!-- Tabla FIDS -->
  <table>
    <thead>
      <tr>
        <th>Hora</th>
        <th>Destino</th>
        <th>Escalas</th>
        <th>Autobús</th>
        <th>Abordaje</th>
        <th>Estatus</th>
        <th class="actions-cell">Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla-salidas">
      <tr><td colspan="7">Cargando datos...</td></tr>
    </tbody>
  </table>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const binId = urlParams.get('id') || 'e6f5164bca1f30d3fdd1';
    const esTv = urlParams.get('vista') === 'tv';
    const API_URL = `https://api.npoint.io/${binId}`;

    if (esTv) document.body.classList.add('tv-mode');

    let datosLocales = [];
    let synth = window.speechSynthesis;
    let voces = [];

    // Cargar voces disponibles
    function cargarVoces() {
      if (!synth) return;
      voces = synth.getVoices();
      const voiceSelect = document.getElementById('voice-select');
      if (!voiceSelect) return;
      voiceSelect.innerHTML = '';
      
      voces.forEach((voice, index) => {
        if (voice.lang.includes('es')) {
          const option = document.createElement('option');
          option.value = index;
          option.textContent = `${voice.name} (${voice.lang})`;
          voiceSelect.appendChild(option);
        }
      });
    }

    if (synth) {
      cargarVoces();
      if (synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = cargarVoces;
      }
    }

    function anunciarSalida(index) {
      const item = datosLocales[index];
      if (!item || !synth) return;

      const mensaje = `Atención pasajeros. Autobús de Transpais con destino a ${item.destino}, hora de salida ${item.hora}, estatus ${item.estatus}. Por favor pase a ${item.abordaje}.`;
      const utterance = new SpeechSynthesisUtterance(mensaje);
      
      const voiceSelect = document.getElementById('voice-select');
      if (voiceSelect && voces[voiceSelect.value]) {
        utterance.voice = voces[voiceSelect.value];
      }
      
      utterance.rate = 0.9;
      synth.speak(utterance);
    }

    function probarVoz() {
      if (!synth) return;
      const utterance = new SpeechSynthesisUtterance("Prueba de audio del sistema de anuncios Transpais.");
      const voiceSelect = document.getElementById('voice-select');
      if (voiceSelect && voces[voiceSelect.value]) {
        utterance.voice = voces[voiceSelect.value];
      }
      synth.speak(utterance);
    }

    // Reloj
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('es-MX');
    }, 1000);

    // Cargar desde npoint.io
    async function cargarSalidas() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('Error de conexión');
        const data = await res.json();
        
        datosLocales = Array.isArray(data) ? data : [];
        renderizarTabla();
        document.getElementById('last-update').innerText = 'Sincronizado: ' + new Date().toLocaleTimeString();
      } catch (err) {
        console.error(err);
        document.getElementById('last-update').innerText = 'Error al actualizar datos.';
      }
    }

    function renderizarTabla() {
      const tbody = document.getElementById('tabla-salidas');
      tbody.innerHTML = '';

      if (datosLocales.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7">No hay corridas programadas</td></tr>';
        return;
      }

      datosLocales.forEach((item, index) => {
        let badgeClass = 'status-espera';
        if (item.estatus === 'ABORDANDO') badgeClass = 'status-abordando';
        if (item.estatus === 'CANCELADO') badgeClass = 'status-cancelado';
        if (item.estatus === 'A TIEMPO') badgeClass = 'status-atiempo';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight:bold; color:#fbbf24;">${item.hora || '--:--'}</td>
          <td><strong>${item.destino || ''}</strong></td>
          <td style="font-size: 0.85rem; color: #cbd5e1;">${item.escalas || '-'}</td>
          <td>${item.autobus || '---'}</td>
          <td>${item.abordaje || 'Oficina'}</td>
          <td><span class="status-badge ${badgeClass}">${item.estatus}</span></td>
          <td class="actions-cell">
            <button class="btn-action btn-announce" onclick="anunciarSalida(${index})" title="Anunciar por voz">🔊</button>
            <button class="btn-action btn-edit" onclick="editarSalida(${index})">Editar</button>
            <button class="btn-action btn-delete" onclick="eliminarSalida(${index})">Borrar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Guardar en npoint.io usando el método PUT correcto
    async function guardarEnNube() {
      try {
        const res = await fetch(API_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datosLocales)
        });
        if (!res.ok) throw new Error('Error al guardar');
        cargarSalidas();
      } catch (err) {
        alert('Ocurrió un error al intentar guardar los cambios en la nube.');
      }
    }

    function guardarSalida() {
      const editIdx = parseInt(document.getElementById('edit-index').value);
      const hora = document.getElementById('f-hora').value;
      const destino = document.getElementById('f-destino').value;
      const escalas = document.getElementById('f-escalas').value;
      const autobus = document.getElementById('f-autobus').value;
      const abordaje = document.getElementById('f-abordaje').value;
      const estatus = document.getElementById('f-estatus').value;

      if (!hora || !destino) {
        alert('Por favor ingresa al menos hora y destino');
        return;
      }

      const nuevaSalida = { id: Date.now(), hora, destino, escalas, autobus, abordaje, estatus };

      if (editIdx >= 0) {
        datosLocales[editIdx] = nuevaSalida;
      } else {
        datosLocales.push(nuevaSalida);
      }

      guardarEnNube();
      cancelarEdicion();
    }

    function editarSalida(index) {
      const item = datosLocales[index];
      document.getElementById('edit-index').value = index;
      document.getElementById('f-hora').value = item.hora;
      document.getElementById('f-destino').value = item.destino;
      document.getElementById('f-escalas').value = item.escalas || '';
      document.getElementById('f-autobus').value = item.autobus || '';
      document.getElementById('f-abordaje').value = item.abordaje || 'Oficina Pedro Cárdenas';
      document.getElementById('f-estatus').value = item.estatus;

      document.getElementById('form-title').innerText = 'Modificar Salida';
      document.getElementById('btn-save').innerText = 'Guardar Cambios';
      document.getElementById('btn-cancel').style.display = 'inline-block';
    }

    function cancelarEdicion() {
      document.getElementById('edit-index').value = '-1';
      document.getElementById('f-hora').value = '';
      document.getElementById('f-destino').value = '';
      document.getElementById('f-escalas').value = '';
      document.getElementById('f-autobus').value = '';
      document.getElementById('f-abordaje').value = 'Oficina Pedro Cárdenas';
      document.getElementById('f-estatus').value = 'EN ESPERA';

      document.getElementById('form-title').innerText = 'Agregar / Modificar Salida';
      document.getElementById('btn-save').innerText = 'Agregar Salida';
      document.getElementById('btn-cancel').style.display = 'none';
    }

    function eliminarSalida(index) {
      if (confirm('¿Deseas borrar esta corrida?')) {
        datosLocales.splice(index, 1);
        guardarEnNube();
      }
    }

    cargarSalidas();
    setInterval(cargarSalidas, 8000);
  </script>
</body>
</html>
