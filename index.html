<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transpais FIDS - Terminal Pedro Cárdenas</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #000B18;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
      overflow-x: hidden;
    }

    .glass-header {
      background: rgba(0, 20, 45, 0.95);
      border-bottom: 3px solid #00A859;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .brand-logo {
      background: #ffffff;
      padding: 8px 20px;
      border-radius: 12px;
      font-weight: 900;
      font-style: italic;
      font-size: 28px;
      color: #002A5C;
      letter-spacing: -1px;
    }

    .glass-card {
      background: rgba(0, 30, 68, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      margin: 20px 30px;
      flex-grow: 1;
    }

    .control-bar {
      background: rgba(0, 0, 0, 0.4);
      padding: 12px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-green { background: #00A859; color: #ffffff; }
    .btn-green:hover { background: #008f4b; }
    .btn-dark { background: rgba(255, 255, 255, 0.1); color: #cccccc; }
    .btn-dark:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
    .btn-blue { background: #002A5C; color: #818cf8; border: 1px solid rgba(129, 140, 248, 0.3); }
    .btn-arrive { background: #d97706; color: #ffffff; font-weight: 900; }
    .btn-arrive:hover { background: #b45309; }

    table { width: 100%; border-collapse: collapse; text-align: left; }

    th {
      background: rgba(0, 20, 45, 0.9);
      color: #93c5fd;
      padding: 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    td { padding: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

    .badge-status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      display: inline-block;
    }

    .status-espera { background: rgba(23, 162, 184, 0.2); color: #17a2b8; border: 1px solid rgba(23, 162, 184, 0.4); }
    .status-etiq { background: #FFB800; color: #000; animation: pulseGlow 1.4s infinite ease-in-out; }
    .status-abordaje { background: #00D974; color: #000; animation: pulseGlow 1.0s infinite ease-in-out; }
    .status-salido { background: rgba(255, 255, 255, 0.05); color: #888; }

    @keyframes pulseGlow {
