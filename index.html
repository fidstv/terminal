<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vialtis v32 - Control de Salidas y Voceos</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-dark text-white">

  <div class="container py-4">
    <h2>Vialtis v32 - Panel de Control Terminal</h2>
    <hr class="border-secondary">

    <!-- PANEL DE CONTROL DE VOCEOS - OFICINA 2 (SORIANA) -->
    <div class="card p-3 my-3 shadow-sm bg-secondary text-white" id="panel-controles-audio-of2">
      <h5 class="mb-3">🔊 Control de Voceos - Oficina 2 (Soriana)</h5>
      <p class="small text-light">Activa o desactiva de forma independiente cada aviso sonoro:</p>
      
      <div class="d-flex flex-column gap-2">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="switch-etiquetado-of2" 
                 onchange="cambiarEstadoAudioOficina2('desactivarEtiquetado', !this.checked)">
          <label class="form-check-label text-white" for="switch-etiquetado-of2">
            Voceo de Etiquetado de Equipaje
          </label>
        </div>

        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="switch-abordaje-of2" 
                 onchange="cambiarEstadoAudioOficina2('desactivarAbordaje', !this.checked)">
          <label class="form-check-label text-white" for="switch-abordaje-of2">
            Voceo de Abordar Unidad (Desactivado por defecto hasta el arribo de la unidad)
          </label>
        </div>

        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="switch-ultima-of2" 
                 onchange="cambiarEstadoAudioOficina2('desactivarUltimaLlamada', !this.checked)">
          <label class="form-check-label text-white" for="switch-ultima-of2">
            Voceo de Última Llamada
          </label>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
