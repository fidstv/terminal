<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vialtis v32 - Panel de Control y Salidas</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <h1>Sistema Vialtis - Oficina 2 / Soriana</h1>
    
    <!-- PANEL DE CONTROL DE AUDIOS - OFICINA 2 -->
    <div class="card p-3 my-3 shadow-sm" id="panel-controles-audio">
      <h5>🔊 Control de Voceos - Oficina 2 (Soriana)</h5>
      
      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" id="switch-etiquetado-of2" 
               onchange="cambiarEstadoAudioOficina2('desactivarEtiquetado', !this.checked)">
        <label class="form-check-label" for="switch-etiquetado-of2">
          Voceo de Etiquetado de Equipaje
        </label>
      </div>

      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" id="switch-abordaje-of2" 
               onchange="cambiarEstadoAudioOficina2('desactivarAbordaje', !this.checked)">
        <label class="form-check-label" for="switch-abordaje-of2">
          Voceo de Abordar Unidad
        </label>
      </div>

      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" id="switch-ultima-of2" 
               onchange="cambiarEstadoAudioOficina2('desactivarUltimaLlamada', !this.checked)">
        <label class="form-check-label" for="switch-ultima-of2">
          Voceo de Última Llamada
        </label>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
